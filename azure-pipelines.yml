trigger:
  branches:
    include:
      - feature/*

pr: none

variables:
  - group: pipeline-secrets
  - name: IMAGE
    value: acrappcliente.azurecr.io/ms-alumnos-service
  - name: JIRA_BASE
    value: $(JIRA_URL)/rest/api/3
  - name: K8S_NAMESPACE
    value: msirildev
  - name: APIM_NAME
    value: apim-app-cliente
  - name: APIM_RG
    value: rg-app-azure-cliente
  - name: APIM_API_ID
    value: ms-alumnos

stages:

  # â”€â”€â”€ STAGE 1: Spectral Contract Validation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - stage: ContractValidation
    displayName: "Stage 1 â€” Spectral Contract Validation"
    jobs:
      - job: SpectralJob
        displayName: "Validar contrato OpenAPI con Spectral"
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - bash: npm install -g @stoplight/spectral-cli @stoplight/spectral-formats @stoplight/spectral-rulesets
            displayName: "Instalar Spectral"

          - bash: |
              spectral lint "$(Build.SourcesDirectory)/src/main/resources/openapi/api.yml" \
                --ruleset "$(Build.SourcesDirectory)/.spectral.yml" \
                --format pretty
            displayName: "Spectral lint api.yml"

  # â”€â”€â”€ STAGE 2: Jira En curso + Build â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - stage: Build
    displayName: "Stage 2 â€” Jira En curso + Build"
    dependsOn: ContractValidation
    jobs:
      - job: BuildJob
        displayName: "Jira + Maven Build"
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - bash: |
              FULL_BRANCH="$(Build.SourceBranch)"
              ISSUE_KEY=$(echo "$FULL_BRANCH" | grep -oP 'SCRUM-\d+' | head -1)

              if [ -z "$ISSUE_KEY" ]; then
                echo "Sin SCRUM-NNN en rama. Abortando."
                exit 1
              fi

              echo "Tarjeta detectada: $ISSUE_KEY"
              echo "##vso[task.setvariable variable=JIRA_KEY;isOutput=true]$ISSUE_KEY"

              curl -s -o /dev/null -w "Transicion En curso: %{http_code}\n" -X POST \
                "$(JIRA_BASE)/issue/$ISSUE_KEY/transitions" \
                -u "$(JIRA_EMAIL):$(JIRA_TOKEN)" \
                -H "Content-Type: application/json" \
                -d '{"transition":{"id":"21"}}'

              curl -s -o /dev/null -X POST \
                "$(JIRA_BASE)/issue/$ISSUE_KEY/comment" \
                -u "$(JIRA_EMAIL):$(JIRA_TOKEN)" \
                -H "Content-Type: application/json" \
                -d "{\"body\":{\"type\":\"doc\",\"version\":1,\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Pipeline ms-alumnos-service iniciado desde: $FULL_BRANCH â€” Build en progreso... MSIRILDEV\"}]}]}}"
            displayName: "Detectar tarjeta Jira y mover a En curso"
            name: jiraStep

          - task: JavaToolInstaller@0
            displayName: "Instalar Java 21"
            inputs:
              versionSpec: "21"
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - bash: mvn clean package -DskipTests --no-transfer-progress
            displayName: "Maven package"

          - publish: $(System.DefaultWorkingDirectory)/target
            artifact: app-jar
            displayName: "Publicar JAR artifact"

  # â”€â”€â”€ STAGE 3: Crear Pull Request â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - stage: CreatePR
    displayName: "Stage 3 â€” Crear PR + Comentar Jira"
    dependsOn: Build
    variables:
      JIRA_KEY: $[ stageDependencies.Build.BuildJob.outputs['jiraStep.JIRA_KEY'] ]
    jobs:
      - job: CreatePRJob
        displayName: "Crear PR hacia main"
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              BRANCH_NAME=$(echo "$(Build.SourceBranch)" | sed 's|refs/heads/||')
              ISSUE_KEY="$(JIRA_KEY)"
              REPO="$(Build.Repository.Name)"

              EXISTING=$(gh pr list \
                --head "$BRANCH_NAME" \
                --base main \
                --json number \
                --jq '.[0].number' \
                --repo "$REPO" 2>/dev/null || echo "")

              if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
                PR_ID="$EXISTING"
                PR_URL="https://github.com/$REPO/pull/$PR_ID"
              else
                PR_URL=$(gh pr create \
                  --base main \
                  --head "$BRANCH_NAME" \
                  --title "[$ISSUE_KEY] Auto PR: $BRANCH_NAME" \
                  --body "Pipeline Azure DevOps ms-alumnos-service â€” $ISSUE_KEY MSIRILDEV" \
                  --repo "$REPO")
                PR_ID=$(echo "$PR_URL" | grep -o '[0-9]*$')
              fi

              echo "##vso[task.setvariable variable=PR_ID;isOutput=true]$PR_ID"

              curl -s -o /dev/null -X POST \
                "$(JIRA_BASE)/issue/$ISSUE_KEY/comment" \
                -u "$(JIRA_EMAIL):$(JIRA_TOKEN)" \
                -H "Content-Type: application/json" \
                -d "{\"body\":{\"type\":\"doc\",\"version\":1,\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Pull Request creado: $PR_URL\"}]}]}}"
            displayName: "Crear PR hacia main"
            name: prStep
            env:
              GH_TOKEN: $(GH_PAT_TOKEN)

  # â”€â”€â”€ STAGE 4: Merge PR + Jira In Review â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - stage: MergePR
    displayName: "Stage 4 â€” Merge PR + Jira In Review"
    dependsOn:
      - Build
      - CreatePR
    variables:
      JIRA_KEY: $[ stageDependencies.Build.BuildJob.outputs['jiraStep.JIRA_KEY'] ]
      PR_ID: $[ stageDependencies.CreatePR.CreatePRJob.outputs['prStep.PR_ID'] ]
    jobs:
      - job: MergePRJob
        displayName: "Merge y Jira In Review"
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              gh pr merge "$(PR_ID)" \
                --merge \
                --admin \
                --repo "$(Build.Repository.Name)"
            displayName: "Mergear PR en GitHub"
            env:
              GH_TOKEN: $(GH_PAT_TOKEN)

          - bash: |
              curl -s -o /dev/null -w "Transicion In Review: %{http_code}\n" -X POST \
                "$(JIRA_BASE)/issue/$(JIRA_KEY)/transitions" \
                -u "$(JIRA_EMAIL):$(JIRA_TOKEN)" \
                -H "Content-Type: application/json" \
                -d '{"transition":{"id":"31"}}'
            displayName: "Jira a In Review (ID 31)"

  # â”€â”€â”€ STAGE 5: Docker Build â†’ ACR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - stage: DockerACR
    displayName: "Stage 5 â€” Docker Build â†’ ACR"
    dependsOn:
      - Build
      - MergePR
    variables:
      JIRA_KEY: $[ stageDependencies.Build.BuildJob.outputs['jiraStep.JIRA_KEY'] ]
    jobs:
      - job: DockerACRJob
        displayName: "Build y Push imagen a ACR"
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 1

          - download: current
            artifact: app-jar

          - bash: |
              mkdir -p $(System.DefaultWorkingDirectory)/target
              cp $(Pipeline.Workspace)/app-jar/*.jar $(System.DefaultWorkingDirectory)/target/
            displayName: "Copiar JAR a target/"

          - task: Docker@2
            displayName: "Build y Push imagen Docker"
            inputs:
              command: buildAndPush
              containerRegistry: acr-connection
              repository: ms-alumnos-service
              dockerfile: $(Build.SourcesDirectory)/Dockerfile
              tags: |
                $(Build.SourceVersion)
                latest

          - bash: |
              curl -s -o /dev/null -X POST \
                "$(JIRA_BASE)/issue/$(JIRA_KEY)/comment" \
                -u "$(JIRA_EMAIL):$(JIRA_TOKEN)" \
                -H "Content-Type: application/json" \
                -d "{\"body\":{\"type\":\"doc\",\"version\":1,\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Imagen Docker pusheada: $(IMAGE):$(Build.SourceVersion) MSIRILDEV\"}]}]}}"
            displayName: "Comentar imagen en Jira"

  # â”€â”€â”€ STAGE 6: Deploy AKS + Importar APIM + Jira Listo â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - stage: DeployAKS
    displayName: "Stage 6 â€” Deploy AKS + APIM + Jira Listo"
    dependsOn:
      - Build
      - DockerACR
    variables:
      JIRA_KEY: $[ stageDependencies.Build.BuildJob.outputs['jiraStep.JIRA_KEY'] ]
    jobs:
      - job: DeployAKSJob
        displayName: "Deploy en AKS y registrar en APIM"
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 1

          - task: AzureCLI@2
            displayName: "Encender AKS"
            inputs:
              azureSubscription: azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks start \
                  --resource-group $(APIM_RG) \
                  --name aks-app-cliente
                az aks wait --resource-group $(APIM_RG) --name aks-app-cliente --custom "powerState.code=='Running'" --interval 15 --timeout 180

          - task: AzureCLI@2
            displayName: "Obtener credenciales AKS"
            inputs:
              azureSubscription: azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials \
                  --resource-group $(APIM_RG) \
                  --name aks-app-cliente \
                  --overwrite-existing

          - task: AzureCLI@2
            displayName: "Aplicar manifiestos K8s"
            inputs:
              azureSubscription: azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                kubectl apply -f k8s/ --namespace=$(K8S_NAMESPACE)
                kubectl set image deployment/ms-alumnos-service \
                  ms-alumnos-service=$(IMAGE):$(Build.SourceVersion) \
                  --namespace=$(K8S_NAMESPACE)
                kubectl rollout status deployment/ms-alumnos-service \
                  --namespace=$(K8S_NAMESPACE) \
                  --timeout=120s

          - task: AzureCLI@2
            displayName: "Importar contrato OpenAPI en APIM"
            inputs:
              azureSubscription: azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az apim api import \
                  --resource-group $(APIM_RG) \
                  --service-name $(APIM_NAME) \
                  --api-id $(APIM_API_ID) \
                  --path /alumnos \
                  --specification-format OpenApi \
                  --specification-path src/main/resources/openapi/api.yml \
                  --display-name "Registro de Alumnos" \
                  --protocols https

          - task: AzureCLI@2
            displayName: "Apagar AKS al terminar"
            inputs:
              azureSubscription: azure-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks stop \
                  --resource-group $(APIM_RG) \
                  --name aks-app-cliente
            condition: always()

          - bash: |
              curl -s -o /dev/null -w "Transicion Listo: %{http_code}\n" -X POST \
                "$(JIRA_BASE)/issue/$(JIRA_KEY)/transitions" \
                -u "$(JIRA_EMAIL):$(JIRA_TOKEN)" \
                -H "Content-Type: application/json" \
                -d '{"transition":{"id":"41"}}'
              curl -s -o /dev/null -X POST \
                "$(JIRA_BASE)/issue/$(JIRA_KEY)/comment" \
                -u "$(JIRA_EMAIL):$(JIRA_TOKEN)" \
                -H "Content-Type: application/json" \
                -d "{\"body\":{\"type\":\"doc\",\"version\":1,\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Deploy exitoso en AKS. Contrato importado en APIM. Build: $(Build.BuildId) MSIRILDEV\"}]}]}}"
            displayName: "Jira a Listo (ID 41)"
            condition: succeeded()

          - bash: |
              curl -s -o /dev/null -X POST \
                "$(JIRA_BASE)/issue/$(JIRA_KEY)/transitions" \
                -u "$(JIRA_EMAIL):$(JIRA_TOKEN)" \
                -H "Content-Type: application/json" \
                -d '{"transition":{"id":"11"}}'
              curl -s -o /dev/null -X POST \
                "$(JIRA_BASE)/issue/$(JIRA_KEY)/comment" \
                -u "$(JIRA_EMAIL):$(JIRA_TOKEN)" \
                -H "Content-Type: application/json" \
                -d "{\"body\":{\"type\":\"doc\",\"version\":1,\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Pipeline fallido Stage 6. Build: $(Build.BuildId) MSIRILDEV\"}]}]}}"
            displayName: "Jira a Por hacer si falla (ID 11)"
            condition: failed()
